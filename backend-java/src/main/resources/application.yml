server:
  port: ${PORT:3333}

spring:
  application:
    name: agendepro-backend

  config:
    # Carrega o .env da pasta de onde a aplicação é executada (backend-java), se existir
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agendepro_java}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE_MB:5}MB
      max-request-size: ${MAX_FILE_SIZE_MB:5}MB

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

logging:
  level:
    root: INFO
    com.agendepro: DEBUG
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}

# ─── Configurações próprias da aplicação (equivalentes ao config/env.ts do backend Node) ───
app:
  jwt:
    secret: ${JWT_SECRET}
    expires-in: ${JWT_EXPIRES_IN:7d}
  cors:
    # Lista separada por vírgula. Aceita origem exata (https://nimbo-dusky.vercel.app) e padrão com curinga
    # para previews (https://nimbo-*.vercel.app). CORS_ORIGIN (nome antigo) segue valendo como alternativa.
    # O padrão cobre o front local (vite dev em 5173, também por 127.0.0.1, e vite preview em 4173).
    origins: ${CORS_ALLOWED_ORIGINS:${CORS_ORIGIN:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://localhost:3000}}
  upload-dir: ${UPLOAD_DIR:uploads}
  app-url: ${APP_URL:http://localhost:5173}
  bcrypt-rounds: ${BCRYPT_ROUNDS:10}
  mail-from: ${SMTP_FROM:Nimbo <noreply@agendepro.com>}
  seed:
    enabled: ${SEED_ENABLED:false}
  # Primeiro super admin sem acesso ao banco: preencha e-mail e senha (mín. 10 caracteres), suba o serviço, entre e
  # REMOVA a senha do ambiente. Não altera um usuário que já existe.
  bootstrap:
    super-admin:
      email: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD:}
      name: ${BOOTSTRAP_SUPER_ADMIN_NAME:Super Admin}
  # WhatsApp padrão da plataforma (Evolution API): usado no código de confirmação do agendamento quando o
  # estabelecimento não configurou o próprio (Configurações → Portal do Cliente → Integração WhatsApp).
  whatsapp:
    default-api-url: ${WHATSAPP_DEFAULT_API_URL:}
    default-api-key: ${WHATSAPP_DEFAULT_API_KEY:}
    default-instance: ${WHATSAPP_DEFAULT_INSTANCE:}
  # Agendamento por celular. Com WhatsApp configurado (do estabelecimento ou o padrão acima) o cliente confirma com um
  # código. Sem WhatsApp, o horário fica PENDENTE e o cliente confirma mandando uma mensagem ao WhatsApp do
  # estabelecimento. O cliente tem confirm-minutes para isso; se não tocar, o horário é liberado. Depois que ele toca, o
  # horário fica reservado sem prazo até o dono confirmar.
  pending:
    confirm-minutes: ${PENDING_CONFIRM_MINUTES:180}   # prazo do CLIENTE para tocar em "Confirmar no WhatsApp" (nunca passa do horário)
    expiry-enabled: true
    expiry-check-ms: 60000
  # Aviso ao dono (e-mail) de agendamento que o cliente já confirmou e ele ainda não: 2 h e 1 h antes do horário.
  owner-reminders:
    enabled: ${OWNER_REMINDERS_ENABLED:true}
    check-interval-ms: 60000
  # Fila de avisos (tabela notification_outbox): pedido novo/cancelamento/remarcação → dono; aprovação/recusa/cancelamento
  # → cliente. E-mail só sai com SMTP_USER/SMTP_PASS; WhatsApp só com Evolution API (do estabelecimento ou WHATSAPP_DEFAULT_*).
  # Canal indisponível é marcado como ignorado, sem nova tentativa.
  notifications:
    enabled: ${NOTIFICATIONS_ENABLED:true}
    check-interval-ms: 15000
    max-attempts: ${NOTIFICATIONS_MAX_ATTEMPTS:5}
  booking:
    max-attempts-per-ip: ${BOOKING_MAX_ATTEMPTS_PER_IP:10}   # pedidos de agendamento por IP...
    window-minutes: 15                                        # ...nesta janela
    max-pending-per-client: 3                                 # horários pendentes ao mesmo tempo por celular
  # Captcha gratuito (Cloudflare Turnstile). Sem a chave secreta a checagem é pulada: em produção defina TURNSTILE_SECRET_KEY.
  captcha:
    turnstile-secret: ${TURNSTILE_SECRET_KEY:}
  rate-limit:
    auth-capacity: 20
    auth-refill-minutes: 15
    api-capacity: 200
    api-refill-minutes: 1
    # Limites extras por IP em rotas sensíveis (além do limite geral de /api/auth)
    login-capacity: 10              # por 15 min
    forgot-password-capacity: 5     # por 15 min
    reset-password-capacity: 10     # por 15 min (também vale para confirmar troca de e-mail)
    email-change-capacity: 5        # por 15 min
    access-help-capacity: 5         # por 60 min
    # Falhas de login por e-mail (independente do IP)
    login-failures-per-email: 5
    login-failures-window-minutes: 15
  reminders:
    enabled: ${REMINDERS_ENABLED:true}
    # Intervalo entre cada varredura de lembretes (ms). Default: 5 minutos.
    check-interval-ms: ${REMINDERS_INTERVAL_MS:300000}
  password-reset:
    ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}
    max-per-hour: 3                 # pedidos de reset por conta/hora (excedente é ignorado em silêncio)
  email-change:
    ttl-minutes: ${EMAIL_CHANGE_TTL_MINUTES:60}
  mercadopago:
    # Token de plataforma (fallback quando o tenant não tem mp_access_token próprio)
    access-token: ${MP_ACCESS_TOKEN:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
