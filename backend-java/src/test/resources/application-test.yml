app:
  seed:
    enabled: false
  whatsapp:
    allow-private-urls: true     # os testes usam um servidor falso em localhost; UrlSafetyTest cobre a regra
  reminders:
    quiet-hours-enabled: false   # os testes de lembrete rodam a qualquer hora; ReminderQuietHoursTest cobre a regra
  email:
    enabled: true    # o código de e-mail segue coberto; EmailDisabledIntegrationTest cobre o padrão (desligado)
  booking:
    max-attempts-per-ip: 100000
  pending:
    expiry-enabled: false   # os testes chamam expire()/expirePastStart() direto; o agendador (que cancela pendentes de datas passadas) não pode competir
  owner-reminders:
    enabled: false   # os testes chamam run() direto; o agendador não pode competir
  notifications:
    enabled: false   # idem: os testes chamam NotificationDispatcher.run() direto
  jwt:
    secret: test-secret-key-for-integration-tests-only-not-for-production-use
    expires-in: 1h
  cors:
    origins: http://localhost:5173
  # Todos os testes vêm do mesmo IP — limites altos para não interferirem entre si.
  # O comportamento do RateLimitFilter é coberto por RateLimitFilterTest (unitário).
  rate-limit:
    auth-capacity: 100000
    api-capacity: 100000
    login-capacity: 100000
    forgot-password-capacity: 100000
    reset-password-capacity: 100000
    email-change-capacity: 100000
    access-help-capacity: 100000
    login-failures-per-email: 5

spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
