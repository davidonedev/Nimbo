name: CI

# Roda os testes antes de qualquer código entrar na main. Em repositório público o GitHub Actions é gratuito.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (testes com PostgreSQL de verdade)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testes
        working-directory: backend-java
        run: |
          chmod +x mvnw
          ./mvnw -B test

  frontend:
    name: Frontend (tipos, lint, testes e build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependências
        working-directory: frontend
        run: npm ci
      - name: Tipos
        working-directory: frontend
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Lint
        working-directory: frontend
        run: npx eslint src
      - name: Testes
        working-directory: frontend
        run: npx vitest run
      - name: Build
        working-directory: frontend
        run: npm run build
